<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ImaadVFX — Premium VFX Portfolio</title>

<meta name="description"
content="ImaadVFX — Premium Visual Effects, Motion Graphics and Creative Digital Experiences.">

<meta name="theme-color" content="#050608">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050608;
    color: #e9edf2;
    font-size: 14px;
    line-height: 1.6;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================================================
   VARIABLES
========================================================= */

:root {
    --bg: #050608;
    --white: #ffffff;
    --text: #e9edf2;
    --muted: #858b95;
    --cyan: #00e5ff;
    --purple: #8b5cff;
    --border: rgba(255,255,255,.10);
    --max-width: 1180px;
}


/* =========================================================
   LOADING SCREEN
========================================================= */

#loader {
    position: fixed;
    inset: 0;
    z-index: 99999;

    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    background: #050608;

    transition:
        opacity .45s ease,
        visibility .45s ease;
}

#loader.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.loader-logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #fff;
}

.loader-logo span {
    color: var(--cyan);
}

.loader-line {
    width: 120px;
    height: 2px;
    margin-top: 18px;
    overflow: hidden;
    background: rgba(255,255,255,.12);
    border-radius: 10px;
}

.loader-line::after {
    content: "";
    display: block;
    width: 45%;
    height: 100%;
    background: var(--cyan);
    box-shadow: 0 0 15px var(--cyan);

    animation: loadingBar 1s ease-in-out infinite;
}

.loader-text {
    margin-top: 12px;
    color: #666c75;
    font-size: 9px;
    letter-spacing: 2px;
}

@keyframes loadingBar {
    0% {
        transform: translateX(-120%);
    }

    100% {
        transform: translateX(350%);
    }
}


/* =========================================================
   BACKGROUND
========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -10;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(0,229,255,.07),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 60%,
            rgba(139,92,255,.07),
            transparent 30%
        );
}

.grid-background {
    position: fixed;
    inset: 0;
    z-index: -9;
    pointer-events: none;
    opacity: .45;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size: 70px 70px;
}


/* =========================================================
   PARTICLES
========================================================= */

#particles {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
    z-index: -5;
}


/* =========================================================
   CURSOR LIGHT
========================================================= */

.cursor-light {
    position: fixed;

    width: 260px;
    height: 260px;

    border-radius: 50%;

    pointer-events: none;
    z-index: -2;

    transform: translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(0,229,255,.08),
            transparent 68%
        );

    filter: blur(8px);
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar {
    position: fixed;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    width: min(1150px, 92%);

    min-height: 60px;

    padding: 10px 16px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(7,9,13,.82);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid var(--border);
    border-radius: 16px;

    z-index: 1000;

    box-shadow:
        0 15px 50px rgba(0,0,0,.25);
}

.logo {
    display: flex;
    align-items: center;
    gap: 7px;

    font-size: 17px;
    font-weight: 800;
}

.logo-mark {
    width: 28px;
    height: 28px;

    display: grid;
    place-items: center;

    border-radius: 8px;

    color: #000;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--purple)
        );

    font-size: 11px;
    font-weight: 800;
}

.logo span span {
    color: var(--cyan);
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 24px;

    list-style: none;
}

.nav-links a {
    color: #90949c;
    font-size: 11px;
    font-weight: 600;

    transition: color .25s ease;
}

.nav-links a:hover {
    color: #fff;
}

.nav-contact {
    padding: 8px 14px;

    border-radius: 8px;

    background: var(--cyan);

    color: #000 !important;
}

.menu-button {
    display: none;

    width: 38px;
    height: 38px;

    border: 1px solid var(--border);
    border-radius: 9px;

    background: rgba(255,255,255,.04);

    color: white;
    cursor: pointer;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    min-height: 100vh;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 140px 20px 100px;

    overflow: hidden;
}

.hero-orb {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(30px);
}

.hero-orb.one {
    width: 430px;
    height: 430px;

    background: rgba(0,229,255,.08);

    top: 20%;
    left: 8%;

    animation:
        floatOne 8s ease-in-out infinite alternate;
}

.hero-orb.two {
    width: 380px;
    height: 380px;

    background: rgba(139,92,255,.08);

    bottom: 10%;
    right: 8%;

    animation:
        floatTwo 10s ease-in-out infinite alternate;
}

@keyframes floatOne {
    to {
        transform: translate(70px,-40px);
    }
}

@keyframes floatTwo {
    to {
        transform: translate(-60px,50px);
    }
}

.hero-content {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 900px;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 7px 13px;

    border: 1px solid rgba(0,229,255,.22);
    border-radius: 30px;

    background: rgba(0,229,255,.035);

    color: var(--cyan);

    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;

    margin-bottom: 25px;
}

.status-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--cyan);

    box-shadow: 0 0 12px var(--cyan);

    animation: blink 1.5s infinite;
}

@keyframes blink {
    50% {
        opacity: .3;
    }
}

.hero h1 {
    font-size: clamp(50px, 10vw, 115px);

    line-height: .92;

    font-weight: 800;

    letter-spacing: -5px;

    background:
        linear-gradient(
            110deg,
            #fff 10%,
            #d5fbff 30%,
            var(--cyan) 55%,
            #9f7aff 80%,
            #fff 100%
        );

    background-size: 250% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        titleGradient 7s linear infinite;
}

@keyframes titleGradient {
    to {
        background-position: 250% center;
    }
}

.hero-subtitle {
    margin-top: 20px;

    color: #a5a9b1;

    font-size: 12px;
    font-weight: 600;

    letter-spacing: 3px;
    text-transform: uppercase;
}

.hero-description {
    max-width: 600px;

    margin: 22px auto 0;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.9;
}

.hero-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;

    gap: 10px;

    margin-top: 30px;
}

.btn {
    min-height: 42px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    padding: 0 18px;

    border-radius: 9px;

    font-size: 11px;
    font-weight: 700;

    transition:
        transform .3s,
        box-shadow .3s;
}

.btn-primary {
    background:
        linear-gradient(
            135deg,
            var(--cyan),
            #4aefff
        );

    color: #000;

    box-shadow:
        0 0 25px rgba(0,229,255,.12);
}

.btn-primary:hover {
    transform: translateY(-3px);

    box-shadow:
        0 12px 35px rgba(0,229,255,.22);
}

.btn-secondary {
    border: 1px solid var(--border);

    background: rgba(255,255,255,.035);

    color: white;
}

.btn-secondary:hover {
    transform: translateY(-3px);

    border-color: rgba(0,229,255,.5);

    color: var(--cyan);
}

.scroll-hint {
    position: absolute;

    bottom: 28px;
    left: 50%;

    transform: translateX(-50%);

    color: #555;

    font-size: 8px;
    font-weight: 600;

    letter-spacing: 3px;
}

.scroll-line {
    width: 1px;
    height: 28px;

    margin: 8px auto 0;

    background:
        linear-gradient(
            white,
            transparent
        );

    animation: scrollLine 1.7s infinite;
}

@keyframes scrollLine {
    50% {
        transform: translateY(8px);
        opacity: .3;
    }
}


/* =========================================================
   SECTIONS
========================================================= */

section {
    width: min(var(--max-width), 90%);

    margin: 0 auto;

    padding: 100px 0;
}

.section-top {
    margin-bottom: 45px;
}

.eyebrow {
    margin-bottom: 10px;

    color: var(--cyan);

    font-size: 9px;
    font-weight: 700;

    letter-spacing: 3px;
}

.section-title {
    font-size: clamp(30px, 5vw, 52px);

    line-height: 1.1;

    font-weight: 700;

    letter-spacing: -1.7px;
}

.section-title span {
    color: var(--cyan);
}

.section-description {
    max-width: 590px;

    margin-top: 12px;

    color: var(--muted);

    font-size: 12px;

    line-height: 1.9;
}


/* =========================================================
   ABOUT
========================================================= */

.about-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 70px;

    align-items: center;
}

.about-copy {
    color: #8d929a;

    font-size: 13px;

    line-height: 2;
}

.about-copy strong {
    color: white;
}

.about-copy p + p {
    margin-top: 18px;
}

.stats {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;
}

.stat {
    min-height: 140px;

    padding: 23px;

    border: 1px solid var(--border);

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );

    transition:
        transform .35s,
        border-color .35s;
}

.stat:hover {
    transform: translateY(-6px);

    border-color:
        rgba(0,229,255,.35);
}

.stat-number {
    color: var(--cyan);

    font-size: 25px;
    font-weight: 800;
}

.stat-label {
    margin-top: 5px;

    color: #666c75;

    font-size: 9px;
    font-weight: 700;

    letter-spacing: 1.5px;
}


/* =========================================================
   SERVICES
========================================================= */

.services-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 14px;
}

.service-card {
    position: relative;

    min-height: 250px;

    padding: 27px;

    overflow: hidden;

    border: 1px solid var(--border);

    border-radius: 17px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.05),
            rgba(255,255,255,.015)
        );

    transition:
        transform .4s,
        border-color .4s;
}

.service-card:hover {
    transform: translateY(-7px);

    border-color:
        rgba(0,229,255,.35);
}

.service-number {
    color: #444b54;

    font-size: 9px;
    font-weight: 700;

    letter-spacing: 1px;
}

.service-icon {
    margin: 25px 0 17px;

    font-size: 28px;
}

.service-card h3 {
    margin-bottom: 9px;

    font-size: 17px;
    font-weight: 600;
}

.service-card p {
    color: #777d87;

    font-size: 11px;

    line-height: 1.85;
}


/* =========================================================
   SHOWREEL
========================================================= */

.showreel-box {
    position: relative;

    overflow: hidden;

    border: 1px solid var(--border);

    border-radius: 22px;

    background: #07090d;
}

.showreel-video {
    display: block;

    width: 100%;

    height: auto;

    max-height: 650px;

    background: #000;
}


/* =========================================================
   PROJECTS
========================================================= */

.projects-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;
}

.project-card {
    position: relative;

    height: 350px;

    overflow: hidden;

    border: 1px solid var(--border);

    border-radius: 18px;

    background: #080a0e;

    transition:
        transform .4s,
        border-color .4s;
}

.project-card:hover {
    transform: translateY(-7px);

    border-color:
        rgba(0,229,255,.35);
}

.project-visual {
    position: absolute;
    inset: 0;

    transition: transform .6s;
}

.project-card:hover .project-visual {
    transform: scale(1.08);
}

.project-one {
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(0,229,255,.28),
            transparent 25%
        ),
        linear-gradient(
            135deg,
            #101820,
            #040608
        );
}

.project-two {
    background:
        radial-gradient(
            circle at 60% 30%,
            rgba(139,92,255,.30),
            transparent 27%
        ),
        linear-gradient(
            135deg,
            #15101f,
            #050507
        );
}

.project-three {
    background:
        radial-gradient(
            circle at 45% 35%,
            rgba(255,55,150,.23),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #1b0c16,
            #050506
        );
}

.project-info {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 25px;

    z-index: 3;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.96)
        );
}

.project-category {
    color: var(--cyan);

    font-size: 8px;
    font-weight: 700;

    letter-spacing: 2px;
}

.project-info h3 {
    margin-top: 8px;

    font-size: 19px;
    font-weight: 600;
}

.project-info p {
    margin-top: 5px;

    color: #747a84;

    font-size: 10px;
}


/* =========================================================
   PROCESS
========================================================= */

.process-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;
}

.process {
    padding: 23px;

    border: 1px solid var(--border);

    border-radius: 15px;

    background:
        rgba(255,255,255,.025);
}

.process-number {
    color: rgba(0,229,255,.45);

    font-size: 22px;
    font-weight: 800;
}

.process h3 {
    margin-top: 18px;

    font-size: 14px;
}

.process p {
    margin-top: 7px;

    color: #6e747d;

    font-size: 10px;

    line-height: 1.8;
}


/* =========================================================
   CONTACT
========================================================= */

.contact-box {
    position: relative;

    overflow: hidden;

    padding: 80px 25px;

    text-align: center;

    border: 1px solid var(--border);

    border-radius: 22px;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(0,229,255,.09),
            transparent 45%
        ),
        #080a0e;
}

.contact-content {
    position: relative;
    z-index: 2;
}

.contact-box h2 {
    font-size:
        clamp(34px, 5vw, 60px);

    line-height: 1.05;

    font-weight: 700;

    letter-spacing: -2px;
}

.contact-box h2 span {
    color: var(--cyan);
}

.contact-box p {
    max-width: 530px;

    margin: 15px auto 28px;

    color: #747a84;

    font-size: 12px;

    line-height: 1.8;
}

.contact-links {
    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 9px;
}

.contact-link {
    min-height: 40px;

    display: inline-flex;

    align-items: center;

    gap: 8px;

    padding: 0 15px;

    border: 1px solid var(--border);

    border-radius: 9px;

    background:
        rgba(255,255,255,.025);

    color: #dce0e6;

    font-size: 10px;
    font-weight: 600;

    transition: .3s;
}

.contact-link:hover {
    transform: translateY(-3px);

    color: var(--cyan);

    border-color:
        rgba(0,229,255,.45);
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    padding: 42px 20px;

    text-align: center;

    border-top:
        1px solid
        rgba(255,255,255,.07);

    color: #5f656e;

    font-size: 10px;
}

.footer-logo {
    margin-bottom: 9px;

    color: white;

    font-size: 17px;
    font-weight: 800;
}

.footer-logo span {
    color: var(--cyan);
}

.footer-main strong {
    color: white;
}

.footer-founder strong {
    color: #cfd4db;
}


/* =========================================================
   REVEAL
========================================================= */

.reveal {
    opacity: 0;

    transform: translateY(25px);

    transition:
        opacity .7s ease,
        transform .7s ease;
}

.reveal.visible {
    opacity: 1;

    transform: translateY(0);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px) {

    .nav-links {
        display: none;
    }

    .menu-button {
        display: grid;
        place-items: center;
    }

    .navbar.mobile-open .nav-links {
        display: flex;

        position: absolute;

        top: 67px;
        left: 0;
        right: 0;

        flex-direction: column;

        gap: 3px;

        padding: 10px;

        border: 1px solid var(--border);

        border-radius: 13px;

        background: rgba(7,9,13,.97);
    }

    .navbar.mobile-open .nav-links a {
        display: block;

        padding: 10px;
    }

    .about-grid {
        grid-template-columns: 1fr;
        gap: 40px;
    }

    .services-grid {
        grid-template-columns: 1fr 1fr;
    }

    .projects-grid {
        grid-template-columns: 1fr 1fr;
    }

    .process-grid {
        grid-template-columns: 1fr 1fr;
    }
}


@media(max-width:580px) {

    .navbar {
        top: 12px;
        width: 94%;
    }

    .hero {
        min-height: 100svh;

        padding:
            130px 18px 90px;
    }

    .hero h1 {
        font-size: 56px;
        letter-spacing: -3px;
    }

    section {
        width: 90%;

        padding: 75px 0;
    }

    .services-grid,
    .projects-grid,
    .process-grid {
        grid-template-columns: 1fr;
    }

    .showreel-video {
        min-height: 220px;
    }

    .contact-box {
        padding: 60px 17px;
    }

    .contact-link {
        width: 100%;
        justify-content: center;
    }
}


/* =========================================================
   RED
