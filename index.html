<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ImaadVFX — Premium VFX Portfolio</title>

<meta name="description" content="ImaadVFX — Premium Visual Effects, Motion Graphics and Creative Digital Experiences.">
<meta name="theme-color" content="#050608">

<style>
/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050608;
    color: #e9edf2;
    font-size: 14px;
    line-height: 1.6;
    overflow-x: hidden;
}

body.loading {
    overflow: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   VARIABLES
===================================================== */

:root {
    --bg: #050608;
    --cyan: #00e5ff;
    --purple: #8b5cff;
    --text: #e9edf2;
    --muted: #858b95;
    --border: rgba(255,255,255,0.10);
    --max-width: 1180px;
}


/* =====================================================
   LOADING SCREEN
===================================================== */

#loader {
    position: fixed;
    inset: 0;
    z-index: 99999;

    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    background: #050608;

    transition:
        opacity .45s ease,
        visibility .45s ease;
}

#loader.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.loader-logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #fff;
}

.loader-logo span {
    color: var(--cyan);
}

.loader-bar {
    width: 180px;
    height: 3px;
    margin-top: 22px;
    overflow: hidden;
    border-radius: 20px;
    background: rgba(255,255,255,.08);
}

.loader-progress {
    width: 35%;
    height: 100%;
    border-radius: 20px;
    background: var(--cyan);
    animation: loading 1.2s ease-in-out infinite;
}

.loader-text {
    margin-top: 12px;
    color: #666;
    font-size: 9px;
    letter-spacing: 2px;
}

@keyframes loading {
    0% {
        transform: translateX(-150%);
    }

    100% {
        transform: translateX(600%);
    }
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -10;
    pointer-events: none;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(0,229,255,.07),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 60%,
            rgba(139,92,255,.07),
            transparent 30%
        );
}

.grid-background {
    position: fixed;
    inset: 0;
    z-index: -9;
    pointer-events: none;
    opacity: .45;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size: 70px 70px;
}


/* =====================================================
   PARTICLES
===================================================== */

#particles {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
    z-index: -5;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar {
    position: fixed;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    width: min(1150px, 92%);
    min-height: 60px;

    padding: 10px 16px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(7,9,13,.88);

    border: 1px solid var(--border);
    border-radius: 16px;

    z-index: 1000;

    box-shadow:
        0 15px 50px rgba(0,0,0,.25);
}

.logo {
    display: flex;
    align-items: center;
    gap: 7px;

    font-size: 17px;
    font-weight: 800;
}

.logo-mark {
    width: 28px;
    height: 28px;

    display: grid;
    place-items: center;

    border-radius: 8px;

    color: #000;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--purple)
        );

    font-size: 11px;
    font-weight: 800;
}

.logo-text span {
    color: var(--cyan);
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 24px;
    list-style: none;
}

.nav-links a {
    color: #90949c;
    font-size: 11px;
    font-weight: 600;
}

.nav-links a:hover {
    color: #fff;
}

.nav-contact {
    padding: 8px 14px;
    border-radius: 8px;
    background: var(--cyan);
    color: #000 !important;
}

.menu-button {
    display: none;

    width: 38px;
    height: 38px;

    border: 1px solid var(--border);
    border-radius: 9px;

    background: rgba(255,255,255,.04);
    color: white;

    cursor: pointer;
}


/* =====================================================
   HERO
===================================================== */

.hero {
    min-height: 100vh;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 140px 20px 100px;
}

.hero-content {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 900px;
}

.hero-orb {
    position: absolute;

    border-radius: 50%;
    pointer-events: none;

    filter: blur(30px);
}

.hero-orb.one {
    width: 430px;
    height: 430px;

    background: rgba(0,229,255,.08);

    top: 20%;
    left: 8%;

    animation: floatOne 8s ease-in-out infinite alternate;
}

.hero-orb.two {
    width: 380px;
    height: 380px;

    background: rgba(139,92,255,.08);

    bottom: 10%;
    right: 8%;

    animation: floatTwo 10s ease-in-out infinite alternate;
}

@keyframes floatOne {
    to {
        transform: translate(70px,-40px);
    }
}

@keyframes floatTwo {
    to {
        transform: translate(-60px,50px);
    }
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 7px 13px;

    border: 1px solid rgba(0,229,255,.22);
    border-radius: 30px;

    background: rgba(0,229,255,.035);

    color: var(--cyan);

    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;

    margin-bottom: 25px;
}

.status-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--cyan);

    box-shadow: 0 0 12px var(--cyan);

    animation: blink 1.5s infinite;
}

@keyframes blink {
    50% {
        opacity: .3;
    }
}

.hero h1 {
    font-size: clamp(50px, 10vw, 115px);

    line-height: .92;

    font-weight: 800;

    letter-spacing: -5px;

    background:
        linear-gradient(
            110deg,
            #fff,
            #d5fbff,
            var(--cyan),
            #9f7aff,
            #fff
        );

    background-size: 250% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation: titleGradient 7s linear infinite;
}

@keyframes titleGradient {
    to {
        background-position: 250% center;
    }
}

.hero-subtitle {
    margin-top: 20px;

    color: #a5a9b1;

    font-size: 12px;
    font-weight: 600;

    letter-spacing: 3px;
    text-transform: uppercase;
}

.hero-description {
    max-width: 600px;

    margin: 22px auto 0;

    color: var(--muted);

    font-size: 13px;

    line-height: 1.9;
}

.hero-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;

    gap: 10px;

    margin-top: 30px;
}

.btn {
    min-height: 42px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    padding: 0 18px;

    border-radius: 9px;

    font-size: 11px;
    font-weight: 700;
}

.btn-primary {
    background: var(--cyan);
    color: #000;

    box-shadow:
        0 0 25px rgba(0,229,255,.12);
}

.btn-secondary {
    border: 1px solid var(--border);

    background: rgba(255,255,255,.035);

    color: #fff;
}

.btn:hover {
    transform: translateY(-3px);
}

.scroll-hint {
    position: absolute;

    bottom: 28px;
    left: 50%;

    transform: translateX(-50%);

    color: #555;

    font-size: 8px;
    font-weight: 600;
    letter-spacing: 3px;
}

.scroll-line {
    width: 1px;
    height: 28px;

    margin: 8px auto 0;

    background:
        linear-gradient(
            #fff,
            transparent
        );
}


/* =====================================================
   SECTIONS
===================================================== */

section {
    width: min(var(--max-width), 90%);

    margin: 0 auto;

    padding: 100px 0;
}

.section-top {
    margin-bottom: 45px;
}

.eyebrow {
    margin-bottom: 10px;

    color: var(--cyan);

    font-size: 9px;
    font-weight: 700;

    letter-spacing: 3px;
}

.section-title {
    font-size: clamp(30px, 5vw, 52px);

    line-height: 1.1;

    font-weight: 700;

    letter-spacing: -1.7px;
}

.section-title span {
    color: var(--cyan);
}

.section-description {
    max-width: 590px;

    margin-top: 12px;

    color: var(--muted);

    font-size: 12px;

    line-height: 1.9;
}


/* =====================================================
   ABOUT
===================================================== */

.about-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 70px;

    align-items: center;
}

.about-copy {
    color: #8d929a;

    font-size: 13px;

    line-height: 2;
}

.about-copy strong {
    color: #fff;
}

.about-copy p + p {
    margin-top: 18px;
}

.stats {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;
}

.stat {
    min-height: 140px;

    padding: 23px;

    border: 1px solid var(--border);

    border-radius: 16px;

    background:
        rgba(255,255,255,.035);
}

.stat-number {
    color: var(--cyan);

    font-size: 25px;
    font-weight: 800;
}

.stat-label {
    margin-top: 5px;

    color: #666c75;

    font-size: 9px;
    font-weight: 700;

    letter-spacing: 1.5px;
}


/* =====================================================
   SERVICES
===================================================== */

.services-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 14px;
}

.service-card {
    min-height: 250px;

    padding: 27px;

    border: 1px solid var(--border);

    border-radius: 17px;

    background:
        rgba(255,255,255,.035);
}

.service-card:hover {
    border-color:
        rgba(0,229,255,.35);

    transform: translateY(-6px);
}

.service-number {
    color: #444b54;

    font-size: 9px;
    font-weight: 700;
}

.service-icon {
    margin: 25px 0 17px;

    font-size: 28px;
}

.service-card h3 {
    margin-bottom: 9px;

    font-size: 17px;
}

.service-card p {
    color: #777d87;

    font-size: 11px;

    line-height: 1.85;
}


/* =====================================================
   SHOWREEL
===================================================== */

.showreel-box {
    position: relative;

    width: 100%;

    height: 500px;

    overflow: hidden;

    border: 1px solid var(--border);

    border-radius: 22px;

    background: #000;
}

.showreel-video {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    background: #000;
}

.showreel-fallback {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    text-align: center;

    pointer-events: none;
}

.showreel-fallback h3 {
    font-size: 24px;
}

.showreel-fallback p {
    margin-top: 7px;

    color: #666;

    font-size: 9px;

    letter-spacing: 2px;
}


/* =====================================================
   PROJECTS
===================================================== */

.projects-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;
}

.project-card {
    position: relative;

    height: 350px;

    overflow: hidden;

    border: 1px solid var(--border);

    border-radius: 18px;

    background: #080a0e;
}

.project-visual {
    position: absolute;

    inset: 0;
}

.project-one {
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(0,229,255,.28),
            transparent 25%
        ),
        linear-gradient(
            135deg,
            #101820,
            #040608
        );
}

.project-two {
    background:
        radial-gradient(
            circle at 60% 30%,
            rgba(139,92,255,.30),
            transparent 27%
        ),
        linear-gradient(
            135deg,
            #15101f,
            #050507
        );
}

.project-three {
    background:
        radial-gradient(
            circle at 45% 35%,
            rgba(255,55,150,.23),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #1b0c16,
            #050506
        );
}

.project-info {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 25px;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.96)
        );
}

.project-category {
    color: var(--cyan);

    font-size: 8px;
    font-weight: 700;

    letter-spacing: 2px;
}

.project-info h3 {
    margin-top: 8px;

    font-size: 19px;
}

.project-info p {
    margin-top: 5px;

    color: #747a84;

    font-size: 10px;
}


/* =====================================================
   PROCESS
===================================================== */

.process-grid {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;
}

.process {
    padding: 23px;

    border: 1px solid var(--border);

    border-radius: 15px;

    background:
        rgba(255,255,255,.025);
}

.process-number {
    color: rgba(0,229,255,.45);

    font-size: 22px;
    font-weight: 800;
}

.process h3 {
    margin-top: 18px;

    font-size: 14px;
}

.process p {
    margin-top: 7px;

    color: #6e747d;

    font-size: 10px;

    line-height: 1.8;
}


/* =====================================================
   CONTACT
===================================================== */

.contact-box {
    padding: 80px 25px;

    text-align: center;

    border: 1px solid var(--border);

    border-radius: 22px;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(0,229,255,.09),
            transparent 45%
        ),
        #080a0e;
}

.contact-box h2 {
    font-size: clamp(34px, 5vw, 60px);

    line-height: 1.05;

    font-weight: 700;

    letter-spacing: -2px;
}

.contact-box h2 span {
    color: var(--cyan);
}

.contact-box p {
    max-width: 530px;

    margin: 15px auto 28px;

    color: #747a84;

    font-size: 12px;
}

.contact-links {
    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 9px;
}

.contact-link {
    min-height: 40px;

    display: inline-flex;

    align-items: center;

    gap: 8px;

    padding: 0 15px;

    border: 1px solid var(--border);

    border-radius: 9px;

    background: rgba(255,255,255,.025);

    color: #dce0e6;

    font-size: 10px;

    font-weight: 600;
}

.contact-link:hover {
    color: var(--cyan);

    border-color:
        rgba(0,229,255,.45);

    transform: translateY(-3px);
}


/* =====================================================
   FOOTER
===================================================== */

footer {
    padding: 42px 20px;

    text-align: center;

    border-top:
        1px solid rgba(255,255,255,.07);

    color: #5f656e;

    font-size: 10px;
}

.footer-logo {
    margin-bottom: 9px;

    color: white;

    font-size: 17px;

    font-weight: 800;
}

.footer-logo span {
    color: var(--cyan);
}

.footer-main strong {
    color: white;
}

.footer-founder strong {
    color: #cfd4db;
}


/* =====================================================
   REVEAL
===================================================== */

.reveal {
    opacity: 0;
    transform: translateY(20px);

    transition:
        opacity .6s ease,
        transform .6s ease;
}

.reveal.visible {
    opacity: 1;
    transform: translateY(0);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 900px) {

    .nav-links {
        display: none;
    }

    .menu-button {
        display: grid;
        place-items: center;
    }

    .navbar.mobile-open .nav-links {
        display: flex;

        position: absolute;

        top: 67px;
        left: 0;
        right: 0;

        flex-direction: column;

        gap: 3px;

        padding: 10px;

        border: 1px solid var(--border);

        border-radius: 13px;

        background: #07090d;
    }

    .navbar.mobile-open .nav-links a {
        display: block;
        padding: 10px;
    }

    .about-grid {
        grid-template-columns: 1fr;
        gap: 40px;
    }

    .services-grid {
        grid-template-columns: 1fr 1fr;
    }

    .projects-grid {
        grid-template-columns: 1fr 1fr;
    }

    .process-grid {
        grid-template-columns: 1fr 1fr;
    }
}


@media(max-width: 580px) {

    .navbar {
        top: 12px;
        width: 94%;
    }

    .hero {
        min-height: 100svh;
        padding: 130px 18px 90px;
    }

    .hero h1 {
        font-size: 56px;
        letter-spacing: -3px;
    }

    .hero-subtitle {
        font-size: 9px;
        letter-spacing: 2px;
    }

    section {
        width: 90%;
        padding: 75px 0;
    }

    .services-grid,
    .projects-grid,
    .process-grid {
        grid-template-columns: 1fr;
    }

    .showreel-box {
        height: 350px;
    }

    .contact-box {
        padding: 60px 17px;
    }

    .contact-link {
        width: 100%;
        justify-content: center;
    }
}


@media(max-width: 380px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .hero h1 {
        font-size: 48px;
    }
}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media(prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

    <div class="loader-logo">

<!-- ==============================
